name: Build and publish to CurseForge

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curseforge-${{ github.ref }}
  # Do not interrupt a release after one loader has already been published.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      minecraft: ${{ steps.version.outputs.minecraft }}
      release-type: ${{ steps.version.outputs.release-type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect release
        id: version
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          import os
          import re
          import subprocess
          from pathlib import Path

          def properties(text):
              return dict(line.strip().split("=", 1) for line in text.splitlines()
                          if "=" in line and not line.lstrip().startswith("#"))

          current = properties(Path("gradle.properties").read_text())
          version = current["mod_version"].strip()
          minecraft = current["minecraft_version"].strip()
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+-]*", version):
              raise ValueError("Invalid mod_version")
          if not re.fullmatch(r"[0-9]+(?:\.[0-9]+)+", minecraft):
              raise ValueError("Invalid minecraft_version")

          previous = ""
          before = os.environ.get("BEFORE", "")
          if os.environ["EVENT_NAME"] == "push" and re.fullmatch(r"[0-9a-fA-F]{40,64}", before) and int(before, 16):
              result = subprocess.run(["git", "show", f"{before}:gradle.properties"],
                                      capture_output=True, text=True)
              if result.returncode == 0:
                  previous = properties(result.stdout).get("mod_version", "").strip()

          # Preserve automatic releases on a version change in main. First pushes and
          # manual runs build artifacts only; publishing is never triggered by a missing baseline.
          release = (os.environ["EVENT_NAME"] == "push"
                     and os.environ["GITHUB_REF"] == "refs/heads/main"
                     and bool(previous) and previous != version)
          normalized = version.lower()
          release_type = ("alpha" if "alpha" in normalized else
                          "beta" if any(marker in normalized for marker in
                                        ("beta", "rc", "snapshot", "pre")) else "release")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\nminecraft={minecraft}\n")
              output.write(f"release={str(release).lower()}\nrelease-type={release_type}\n")
          print(f"Version: {previous or '(no baseline)'} -> {version}; publish: {release}")

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test Fabric and Forge
        run: |
          chmod +x gradlew
          ./gradlew :common:test :fabric:build :forge:build --no-daemon

      - name: Collect release jars
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for loader in fabric forge; do
            jar="$loader/build/libs/sdmshop-$loader-$VERSION.jar"
            if [ ! -f "$jar" ]; then
              echo "Expected remapped release jar not found: $jar" >&2
              exit 1
            fi
            mkdir -p "release-files/$loader"
            cp "$jar" "release-files/$loader/"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdmshop-${{ github.sha }}
          path: release-files/**/*.jar
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish ${{ matrix.loader }} to CurseForge
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge]
    steps:
      - name: Check CurseForge configuration
        shell: bash
        env:
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          if [ -z "$CURSEFORGE_PROJECT_ID" ] || [ -z "$CURSEFORGE_TOKEN" ]; then
            echo "Configure CURSEFORGE_PROJECT_ID and CURSEFORGE_TOKEN repository secrets." >&2
            exit 1
          fi

      - name: Download release jars
        uses: actions/download-artifact@v4
        with:
          name: sdmshop-${{ github.sha }}
          path: release-files

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          # Use the project's default dependencies; do not infer file dependencies from the JAR.
          curseforge-dependencies: ''
          files: release-files/${{ matrix.loader }}/*.jar
          name: SDMShop2 ${{ needs.build.outputs.version }} (${{ matrix.loader }})
          version: ${{ needs.build.outputs.version }}-${{ matrix.loader }}
          version-type: ${{ needs.build.outputs.release-type }}
          loaders: ${{ matrix.loader }}
          game-versions: ${{ needs.build.outputs.minecraft }}
          java: '17'
          changelog: SDMShop2 ${{ needs.build.outputs.version }} for Minecraft ${{ needs.build.outputs.minecraft }} (${{ matrix.loader }}).
