architectury {
    common rootProject.enabled_platforms.split(',')
}

repositories {
    mavenCentral()
    maven { url = uri("https://jitpack.io") }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"
    modCompileOnly("dev.latvian.mods:kubejs-fabric:${kjs_version}")
    modCompileOnly('com.blamejared.crafttweaker:CraftTweaker-common-1.20.1:14.0.60')
    minecraftLibraries("com.github.ben-manes.caffeine:caffeine:3.2.3")
    minecraftLibraries("org.mongodb:mongodb-driver-sync:5.6.5")
    modCompileOnly "dev.ftb.mods:ftb-quests:2001.4.22"
    modCompileOnly "dev.ftb.mods:ftb-library:2001.2.13"
    testImplementation("org.mongodb:mongodb-driver-sync:5.6.5")
    compileOnly("org.yaml:snakeyaml:2.2")
    compileOnly("com.github.DeusSixik:YamlConfig:1.2.0")
    modCompileOnly("com.github.DeusSixik.UniGui:unigui-common-${minecraft_version}:v${unigui_version}")
    compileOnly("com.github.DeusSixik.UniGui:unigui-core:v${unigui_version}")
    testCompileOnly("com.github.DeusSixik.UniGui:unigui-core:v${unigui_version}")
    testRuntimeOnly("com.github.DeusSixik.UniGui:unigui-core:v${unigui_version}")
    // Minecraft widgets need Loom's named mapping, rather than the published intermediary jar.
    testRuntimeOnly(files(configurations.compileClasspath.filter { it.name.startsWith("unigui-common-") }))
}
